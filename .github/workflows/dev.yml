name: Develop

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Dev server
        id: dev-server
        background: true
        run: bun run dev

      - name: Stop API Server
        cancel: dev-server
