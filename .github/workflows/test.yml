name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run build
      - name: Server
        id: server
        background: true
        run: bun run serve
      - name: Wait for Server
        run: sleep 1
      - name: Test Server
        run: |
          curl --fail --retry-connrefused --retry 3 http://localhost:3000
          curl --fail http://localhost:3000/favicon.ico
          curl --fail http://localhost:3000/apple-touch-icon.png
          curl --fail http://localhost:3000/manifest.json
      - run: bun run test-server http://localhost:3000
      - name: Stop Server
        cancel: server
